const Pill=({color='slate',children,sm})=>(<span className={`inline-flex items-center gap-1 ${sm?'px-2 py-0.5 text-[10px]':'px-2.5 py-1 text-xs'} rounded-full font-medium bg-${color}-50 text-${color}-700 border border-${color}-200`}>{children}</span>);

const Btn=({children,onClick,variant='primary',icon:Icon,size='md',disabled,className=''})=>{const v={primary:'bg-slate-900 text-white hover:bg-slate-800',secondary:'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50',success:'bg-emerald-600 text-white hover:bg-emerald-700',danger:'bg-red-600 text-white hover:bg-red-700',warning:'bg-amber-500 text-white hover:bg-amber-600',ghost:'text-slate-600 hover:bg-slate-100'};const s={sm:'px-2.5 py-1.5 text-xs',md:'px-4 py-2 text-sm',lg:'px-5 py-2.5 text-sm'};return <button disabled={disabled} onClick={onClick} className={`inline-flex items-center gap-1.5 rounded-lg font-medium transition-all ${v[variant]} ${s[size]} ${disabled?'opacity-40 cursor-not-allowed':''} ${className}`}>{Icon&&<Icon className={size==='sm'?'w-3.5 h-3.5':'w-4 h-4'}/>}{children}</button>;};

// ── Searchable Dropdown ──
const SearchableSelect=({label,options,value,onChange,placeholder='Search...',disabled})=>{const[open,setOpen]=useState(false);const[q,setQ]=useState('');const ref=useRef();const sel=options.find(o=>o.value===value);const filtered=options.filter(o=>!q||(o.label+' '+(o.sub||'')).toLowerCase().includes(q.toLowerCase()));useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);return(<div ref={ref} className="relative">{label&&<label className="block text-xs font-medium text-slate-600 mb-1.5">{label}</label>}<div onClick={()=>!disabled&&setOpen(!open)} className={`w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg flex items-center justify-between ${disabled?'opacity-50 cursor-not-allowed':'cursor-pointer hover:border-slate-300'}`}>{sel?(<div className="flex items-center gap-2 min-w-0"><span className="font-semibold text-slate-900 font-mono">{sel.label}</span>{sel.sub&&<span className="text-slate-500 text-xs truncate">{sel.sub}</span>}</div>):<span className="text-slate-400">{placeholder}</span>}<ChevronDown className={`w-4 h-4 text-slate-400 flex-shrink-0 transition-transform ml-2 ${open?'rotate-180':''}`}/></div>{open&&(<div className="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-2xl overflow-hidden"><div className="p-2 border-b border-slate-100"><div className="relative"><Search className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"/><input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Type to filter..." className="w-full pl-8 pr-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-slate-900"/></div></div><div className="max-h-52 overflow-y-auto">{filtered.map(o=>(<div key={o.value} onClick={()=>{onChange(o.value);setOpen(false);setQ('');}} className={`px-3 py-2.5 cursor-pointer hover:bg-slate-50 flex items-center justify-between ${o.value===value?'bg-blue-50':''}`}><div><span className={`text-sm font-mono font-semibold ${o.value===value?'text-blue-700':'text-slate-800'}`}>{o.label}</span>{o.sub&&<span className="text-xs text-slate-500 ml-2">{o.sub}</span>}</div>{o.value===value&&<Check className="w-3.5 h-3.5 text-blue-600"/>}</div>))}{filtered.length===0&&<div className="px-3 py-4 text-sm text-slate-400 text-center">No results</div>}</div></div>)}</div>);};

// ── Print Preview Modal ──
const PrintPreviewModal=({req,tests,employees,onClose})=>{const aTests=tests.filter(t=>(req.approvedTests||req.tests).includes(t.id));const total=aTests.reduce((s,t)=>s+t.price,0);const emp=employees.find(e=>e.id===req.employeeId);const tl=req.timeline||[];const docE=tl.find(t=>t.stage==='DOCTOR_APPROVED'||t.stage==='DOCTOR_PARTIAL_APPROVED');const hrE=tl.find(t=>t.stage==='HR_APPROVED'||t.stage==='ADMIN_APPROVED');const pathE=tl.find(t=>t.stage==='COMPLETED');const fd=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'-';const fdt=d=>d?new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Pending';const calcAge=dob=>{if(!dob)return'';return Math.floor((Date.now()-new Date(dob).getTime())/31557600000)+' yrs';};const isDone=req.status==='COMPLETED';const doPrint=()=>{const sid='__plp_css__';let el=document.getElementById(sid);if(!el){el=document.createElement('style');el.id=sid;document.head.appendChild(el);}el.textContent='@media print{body>*{display:none!important}#__plp_ov__{display:flex!important;position:fixed!important;inset:0!important;background:#fff!important}#__plp_tb__{display:none!important}#__plp_sc__{overflow:visible!important;background:#fff!important;padding:0!important}#__plp_pg__{box-shadow:none!important;border-radius:0!important;width:100%!important;max-width:100%!important}@page{size:A4;margin:15mm}}';setTimeout(()=>{window.print();},150);setTimeout(()=>{const s=document.getElementById(sid);if(s)s.remove();},5000);};const ov={position:'fixed',inset:0,zIndex:2147483647,display:'flex',flexDirection:'column',fontFamily:"'Segoe UI',Arial,sans-serif"};const tb={background:'#1e293b',color:'#fff',padding:'10px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,boxShadow:'0 2px 14px rgba(0,0,0,.5)'};const sc={flex:1,overflowY:'auto',background:'#475569',display:'flex',justifyContent:'center',alignItems:'flex-start',padding:'28px 20px'};const pg={width:'780px',maxWidth:'100%',background:'#fff',padding:'38px 46px',boxShadow:'0 6px 40px rgba(0,0,0,.28)',borderRadius:'10px',fontSize:'12px',color:'#0f172a',lineHeight:'1.55'};const hdr={display:'flex',justifyContent:'space-between',alignItems:'flex-start',borderBottom:'2.5px solid #0f172a',paddingBottom:'13px',marginBottom:'15px'};const strip={background:'#0f172a',color:'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 14px',borderRadius:'6px',marginBottom:'15px',fontSize:'11px',fontWeight:600,gap:'8px',fontFamily:'monospace'};const bdg=isDone?{display:'inline-block',padding:'3px 10px',borderRadius:'3px',fontSize:'10px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',background:'#d1fae5',color:'#065f46',border:'1px solid #a7f3d0'}:{display:'inline-block',padding:'3px 10px',borderRadius:'3px',fontSize:'10px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',background:'#fef3c7',color:'#92400e',border:'1px solid #fde68a'};const g2={display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 20px',marginBottom:'15px'};const box={background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:'6px',padding:'9px 12px'};const lbl={fontSize:'9px',fontWeight:700,textTransform:'uppercase',color:'#94a3b8',letterSpacing:'.6px',marginBottom:'4px'};const val={fontSize:'12px',fontWeight:700,color:'#0f172a'};const sub={fontSize:'10px',color:'#64748b',marginTop:'2px'};const th={background:'#0f172a',color:'#fff',padding:'8px 10px',textAlign:'left',fontSize:'10px',fontWeight:600,textTransform:'uppercase',letterSpacing:'.4px'};const thR={...th,textAlign:'right'};const td=i=>({padding:'7px 10px',fontSize:'11px',color:'#334155',background:i%2?'#f8fafc':'#fff',borderBottom:'1px solid #f1f5f9'});const tdR=i=>({...td(i),textAlign:'right',fontWeight:600});const totL={background:'#f1f5f9',fontWeight:700,fontSize:'11px',padding:'9px 10px',borderTop:'2px solid #cbd5e1',textAlign:'right',textTransform:'uppercase',letterSpacing:'.4px'};const totR={...totL,fontSize:'13px'};const sigs={display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'20px',marginTop:'18px',paddingTop:'13px',borderTop:'1.5px dashed #cbd5e1'};const sig={textAlign:'center'};const sigL={borderBottom:'1px solid #94a3b8',height:'34px',marginBottom:'5px'};const sigT={fontSize:'9px',color:'#64748b',fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px'};const sigN={fontSize:'10px',color:'#334155',marginTop:'2px'};const foot={marginTop:'13px',paddingTop:'8px',borderTop:'1px solid #e2e8f0',display:'flex',justifyContent:'space-between'};
return(<div id="__plp_ov__" style={ov}><div id="__plp_tb__" style={tb}><div style={{display:'flex',alignItems:'center',gap:'12px'}}><span style={{fontSize:'22px'}}>🖨</span><div><div style={{fontWeight:700,fontSize:'14px'}}>Print Preview — {req.reqNo}</div><div style={{fontSize:'10px',color:'#94a3b8',marginTop:'1px'}}>Click <b style={{color:'#fff'}}>"Print / Save PDF"</b> to print or save</div></div></div><div style={{display:'flex',gap:'8px'}}><button onClick={doPrint} style={{background:'#10b981',color:'#fff',border:'none',padding:'9px 22px',borderRadius:'7px',fontWeight:700,fontSize:'13px',cursor:'pointer'}}>🖨 Print / Save PDF</button><button onClick={onClose} style={{background:'#475569',color:'#fff',border:'none',padding:'9px 16px',borderRadius:'7px',fontWeight:700,fontSize:'13px',cursor:'pointer'}}>✕ Close</button></div></div><div id="__plp_sc__" style={sc}><div id="__plp_pg__" style={pg}><div style={hdr}><div><div style={{fontSize:'18px',fontWeight:800,color:'#0f172a'}}>IIEIPATH — PathLab Pro</div><div style={{fontSize:'10px',color:'#64748b',marginTop:'3px'}}>Employee Health Benefit Programme</div></div><div style={{textAlign:'right'}}><div style={{fontSize:'14px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px'}}>Test Requisition Slip</div><div style={{fontSize:'10px',color:'#64748b',marginTop:'4px'}}>Slip No: <strong>{req.slipNo||req.reqNo}</strong></div><div style={{fontSize:'10px',color:'#64748b',marginTop:'2px'}}>Issued: {fd(new Date())}</div></div></div><div style={strip}><span>REQ: {req.reqNo}</span><span style={{color:'#475569'}}>|</span><span>EMP: {req.employeeCode}</span><span style={{color:'#475569'}}>|</span><span>{fd(req.createdAt)}</span><span style={{color:'#475569'}}>|</span><span style={bdg}>{isDone?'✓ COMPLETED':(req.status||'').replace(/_/g,' ')}</span></div><div style={g2}><div style={box}><div style={lbl}>Employee (Sponsor)</div><div style={val}>{req.employeeName}</div><div style={sub}>{req.employeeCode}{emp?` · ${emp.department} · ${emp.designation}`:''}</div></div><div style={box}><div style={lbl}>Patient / Beneficiary</div><div style={val}>{req.beneficiary.name}</div><div style={sub}>Relation: {req.beneficiary.relation}{req.beneficiary.dob?` · Age: ${calcAge(req.beneficiary.dob)}`:''}</div></div><div style={box}><div style={lbl}>Doctor Clearance</div><div style={val}>{docE?docE.by:'—'}</div><div style={sub}>{fdt(docE?.at)}</div></div><div style={box}><div style={lbl}>HR / Admin Approval</div><div style={val}>{hrE?hrE.by:'—'}</div><div style={sub}>{fdt(hrE?.at)}</div></div></div><table style={{width:'100%',borderCollapse:'collapse',marginBottom:'15px'}}><thead><tr><th style={{...th,width:'32px'}}>#</th><th style={{...th,width:'68px'}}>Code</th><th style={th}>Test Name</th><th style={th}>Category</th><th style={thR}>Price (৳)</th></tr></thead><tbody>{aTests.map((t,i)=>(<tr key={t.id}><td style={td(i)}>{i+1}</td><td style={{...td(i),fontFamily:'monospace',fontWeight:700}}>{t.code}</td><td style={td(i)}>{t.name}</td><td style={td(i)}>{t.category}</td><td style={tdR(i)}>{t.price.toLocaleString()}</td></tr>))}<tr><td colSpan="4" style={totL}>Total Amount</td><td style={totR}>৳ {total.toLocaleString()}</td></tr></tbody></table>{req.notes&&(<div style={{border:'1px solid #e2e8f0',borderRadius:'5px',padding:'9px 12px',marginBottom:'15px'}}><div style={lbl}>Clinical Notes</div><div style={{fontSize:'11px',color:'#475569',marginTop:'4px'}}>{req.notes}</div></div>)}<div style={sigs}>{[{label:'Doctor',name:docE?.by},{label:'HR / Admin',name:hrE?.by},{label:'Pathologist',name:pathE?.by}].map((sg,i)=>(<div key={i} style={sig}><div style={sigL}/><div style={sigT}>{sg.label}</div><div style={sigN}>{sg.name||''}</div></div>))}</div><div style={foot}><span style={{fontSize:'9px',color:'#94a3b8'}}>Generated: {new Date().toLocaleString('en-GB')} · PathLab Pro</span><span style={{fontSize:'9px',color:'#94a3b8'}}>Valid only with authorised signatures</span></div></div></div></div>);};

// ── Login ──
const Login=({onLogin})=>{const[u,setU]=useState('');const[p,setP]=useState('');const[err,setErr]=useState('');const submit=async()=>{const users=await dbGet(K.users,[]);const user=users.find(x=>x.username===u&&x.password===p);if(user)onLogin(user);else setErr('Invalid credentials. Default: username = password = Employee ID');};return(<div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-blue-50 p-4"><div className="w-full max-w-md"><div className="text-center mb-8"><div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-700 mb-4 shadow-lg"><FlaskConical className="w-8 h-8 text-white"/></div><h1 className="text-3xl font-bold text-slate-900">PathLab Pro</h1><p className="text-slate-500 mt-1">IIEIPATH — Employee Pathology Benefit System</p></div><Card className="p-7 shadow-xl"><div className="space-y-4"><FInput label="Employee ID" value={u} onChange={e=>setU(e.target.value)} placeholder="e.g. E001" onKeyDown={e=>e.key==='Enter'&&submit()}/><FInput label="Password" type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="Default: your Employee ID" onKeyDown={e=>e.key==='Enter'&&submit()}/>{err&&<div className="text-red-600 text-xs flex items-center gap-1.5"><AlertCircle className="w-3.5 h-3.5"/>{err}</div>}<Btn onClick={submit} className="w-full justify-center" size="lg">Sign In</Btn></div><div className="mt-5 pt-4 border-t border-slate-100"><p className="text-xs text-slate-500 font-medium mb-2">Demo — Username = Password = Employee ID:</p><div className="grid grid-cols-2 gap-1 text-[11px] text-slate-600"><span><b>E000</b> — Admin</span><span><b>E001</b> — Employee</span><span><b>E002</b> — Doctor</span><span><b>E003</b> — HR</span><span><b>E004</b> — Pathologist</span></div></div></Card></div></div>);};

// ── App Shell ──
export default function App(){
  const[session,setSession]=useState(null);
  const[page,setPage]=useState('dashboard');
  const[loading,setLoading]=useState(true);
  const[users,setUsers]=useState([]);
  const[employees,setEmployees]=useState([]);
  const[tests,setTests]=useState([]);
  const[requests,setRequests]=useState([]);
  const[dependents,setDependents]=useState([]);
  useEffect(()=>{(async()=>{await seedData();setUsers(await dbGet(K.users,[]));setEmployees(await dbGet(K.emps,[]));setTests(await dbGet(K.tests,[]));setRequests(await dbGet(K.reqs,[]));setDependents(await dbGet(K.deps,[]));setLoading(false);})();},[]);
  if(loading)return(<div className="min-h-screen flex items-center justify-center bg-slate-50"><div className="text-center"><div className="text-4xl mb-4">⚗️</div><div className="text-slate-600 font-medium">Loading PathLab Pro...</div><div className="text-slate-400 text-sm mt-1">Connecting to Supabase...</div></div></div>);
  if(!session)return <Login onLogin={u=>{setSession(u);setPage('dashboard');}}/>;
  const role=session.role;
  const NAV=[{id:'dashboard',label:'Dashboard',icon:LayoutDashboard,roles:['admin','user','doctor','hr','pathologist']},{id:'new',label:'New Request',icon:FilePlus2,roles:['admin','user','doctor','pathologist']},{id:'mine',label:'My Requests',icon:ClipboardList,roles:['user','doctor','pathologist','admin']},{id:'doctor',label:'Doctor Queue',icon:Stethoscope,roles:['doctor','admin']},{id:'hr',label:'HR Queue',icon:UsersIcon,roles:['hr','admin']},{id:'admin-q',label:'Restricted Queue',icon:AlertTriangle,roles:['admin']},{id:'pathology',label:'Pathology Queue',icon:Microscope,roles:['pathologist','admin']},{id:'all',label:'All Requests',icon:FileText,roles:['admin']},{id:'employees',label:'Employees',icon:UserCheck,roles:['admin','hr']},{id:'tests',label:'Test Library',icon:FlaskConical,roles:['admin','pathologist','doctor','hr','user']},{id:'users',label:'System Users',icon:Lock,roles:['admin']},{id:'reports',label:'Reports',icon:BarChart3,roles:['admin','hr']}].filter(n=>n.roles.includes(role));
  const roleInfo=ROLES.find(r=>r.id===role);
  return(<div className="min-h-screen bg-slate-50 flex"><aside className="w-60 bg-white border-r border-slate-200 flex flex-col"><div className="p-5 border-b border-slate-100"><div className="flex items-center gap-2.5"><div className="w-9 h-9 rounded-lg bg-gradient-to-br from-slate-900 to-slate-700 flex items-center justify-center"><FlaskConical className="w-5 h-5 text-white"/></div><div><p className="font-bold text-slate-900">PathLab Pro</p><p className="text-[10px] text-slate-500 uppercase tracking-wide">IIEIPATH</p></div></div></div><nav className="flex-1 p-3 overflow-y-auto space-y-0.5">{NAV.map(n=>(<button key={n.id} onClick={()=>setPage(n.id)} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium transition-all ${page===n.id?'bg-slate-900 text-white':'text-slate-600 hover:bg-slate-100'}`}><n.icon className="w-4 h-4"/>{n.label}</button>))}</nav><div className="p-3 border-t border-slate-100"><div className="flex items-center gap-2.5 p-2 mb-2">{roleInfo&&<div className={`w-9 h-9 rounded-full bg-${roleInfo.color}-100 flex items-center justify-center flex-shrink-0`}><roleInfo.icon className={`w-4 h-4 text-${roleInfo.color}-600`}/></div>}<div className="flex-1 min-w-0"><p className="text-sm font-semibold text-slate-900 truncate">{session.name}</p><p className="text-[10px] text-slate-500">{session.username} · {roleInfo?.label}</p></div></div><button onClick={()=>setSession(null)} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100"><LogOut className="w-4 h-4"/>Sign Out</button></div></aside><main className="flex-1 overflow-x-hidden"><div className="max-w-7xl mx-auto p-6"><div className="p-16 text-center text-slate-400"><div className="text-5xl mb-4">🚧</div><p className="font-semibold text-slate-700">Full components load from Claude artifact</p><p className="text-sm mt-2">Dashboard, Requests, Employees, Tests, Dependents, Print Slip — all included in the Claude artifact source</p></div></div></main></div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
